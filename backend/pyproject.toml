[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "0.1.0"
description = "Evidence-first AI companion for human-led interviews"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "websockets>=13,<18"
  ,"pypdf>=5.0,<7"
  ,"httpx>=0.27,<1"
]

[project.optional-dependencies]
voice = [
  "pipecat-ai==1.5.0"
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
